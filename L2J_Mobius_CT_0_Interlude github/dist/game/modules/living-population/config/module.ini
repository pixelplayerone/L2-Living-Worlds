# Living Population module
#
# A persistent population of bots that live and progress over time. Phase 1 (cold foundation) keeps this an
# abstract, invisible background simulation: bots gain levels as if hunting, their state is stored and survives
# restarts, and nothing is spawned in the world yet. The hot/cold handoff (bots you can see and follow) and the
# player-like goals arrive in later phases.
#
# The module is on by default. With Enabled False the module does nothing and the server is stock.

# Master on/off switch. Set False and restart to stop the simulation.
Enabled = True

# Number of bots the world holds. Raising it adds bots (spread over the nine starting classes, with random names), in
# waves as set below. Lowering it removes none.
PopulationSize = 100

# New bots arrive in waves, like new players joining: at least this many at a time, every BirthIntervalMinutes, until
# the population reaches PopulationSize. A large population gets bigger waves on its own, so every bot is born within
# about three hours whatever PopulationSize is. Every one is born at level 1 in its starting village, so the waves spread the
# levels out over time. Set BirthBatch = 0 to create all missing bots at once.
BirthBatch = 10
BirthIntervalMinutes = 20

# How often the cold resolver advances due bots, in seconds.
ColdResolveIntervalSeconds = 30

# The maximum number of bots advanced per resolver tick (a fairness/throughput bound).
ColdResolveBatch = 64

# Leveling is per-kill, like a real player, and follows the server's XP rate (RateXp in Rates.ini). A cold
# bot is assumed to clear level-appropriate mobs, so its experience per minute is
#   (level * ColdExpPerMobLevel) * ColdKillsPerMinute * RateXp
# consumed against the server's real experience table. Because the per-level requirement grows far faster
# than the per-kill experience, low levels fly and high levels take much longer, just like retail. Raise the
# server RateXp (or these knobs) to speed the whole world up.
#
# Representative experience a level-appropriate mob gives, per mob level. ~13 mirrors a typical low/mid mob.
ColdExpPerMobLevel = 13
# How many level-appropriate mobs a bot clears per minute (time to kill plus recovery).
ColdKillsPerMinute = 12

# Population director. Keeps the cold world believably peered to the real player: it targets the median level
# of the online human players and biases bot leveling toward it. Bots well below the target catch up faster
# (capped), bots well above slow down, and bots within the band are unaffected. With no players online, or
# this off, leveling is neutral. This shapes the world around whoever is playing without editing spawns.
DirectorEnabled = True
# The level the director pulls the population toward. 0 follows the online players' level (above); any other value
# is a fixed level goal, whoever is online. MaxLevel stays the hard cap.
DirectorLevelGoal = 0
# Levels within this distance of the target are considered in band and unaffected.
DirectorBandRadius = 2
# Cap on the catch-up experience multiplier for bots below the band.
DirectorMaxCatchUp = 1.35
# Experience multiplier for bots above the band (below 1 slows them down). Kept between 0.1 and 1.
DirectorSlowdown = 0.85
# How sharply the catch-up multiplier grows per level below the band.
DirectorCatchUpSlope = 0.06

# Goals and needs economy (Phase 4). While cold, a bot pursues player-like goals abstractly: it earns adena as if
# selling loot, receives the one-time newbie soulshot reward at the milestone level, spends soulshots as if firing
# them, restocks them when low and affordable, and upgrades a gear tier when it can afford the next one. These are
# cheap outcomes on the row. With TravelEnabled (Phase 5, below) the restocking and upgrades happen in town instead,
# using the Phase 5 supply settings; the Soulshot/Potion restock settings here then apply only with travel off. Turn
# this off to keep the population level-only (Phase 1-3 behavior) while the module is enabled.
EconomyEnabled = True
# Adena a level-appropriate kill yields, per mob level (adena/min = level * this * ColdKillsPerMinute).
AdenaPerMobLevel = 5
# The level at which the one-time newbie soulshot reward is granted, and how many shots it grants.
SoulshotMilestoneLevel = 6
SoulshotMilestoneGrant = 1000
# How many soulshots a kill consumes (consumption/min = ColdKillsPerMinute * this).
SoulshotsPerKill = 6
# Restock soulshots when the count falls below this, buying a batch of this many at this adena each.
SoulshotRestockThreshold = 500
SoulshotRestockBatch = 1000
SoulshotCost = 12
# Restock healing potions when the count falls below this, buying a batch of this many at this adena each. Potions
# are not consumed in cold (abstract hunting takes no real damage); a hot bot drinks real ones and the handoff
# captures the remainder, then cold refills.
PotionRestockThreshold = 100
PotionRestockBatch = 500
PotionCost = 60
# Gear upgrades: one tier is unlocked per this many levels (tier ceiling = level / step; 0 disables upgrades). With
# travel on, a tier costs a full set of the grade it reaches, priced from the real item data (median shop price of a
# weapon plus chest, legs, helmet, gloves and boots; the server logs these at start). GearUpgradeCost * (tier + 1)
# is only the fallback when no item prices are available, and the cost used without travel.
GearTierLevelStep = 10
GearUpgradeCost = 50000

# Travel, towns and supplies (Phase 5, needs EconomyEnabled). Each bot hunts in a zone picked for its level from
# data/zones.xml. When it needs supplies, is too weak for its zone or has outleveled it, it uses a Scroll of Escape
# (or walks to the nearest town when it has none), runs its errands at the grocer and the gatekeeper, now and then
# goes AFK, shops, then pays the gatekeeper or walks to its next zone. Bots only shop in town. Hot bots act all of
# this out in the world. Off keeps the Phase 4 behavior (instant restocking in place, no movement).
TravelEnabled = True
# The zone and town catalog, relative to the server working directory. Rebuild it with tools/build_living_zones.py.
ZonesFile = modules/living-population/data/zones.xml
# Healing potions a melee bot likes to carry. Tanks carry half again as many, casters, archers and healers half as many.
PotionStock = 30
# Heads to town for potions at or below this fraction of its stock, and only when it can buy at least half of what it
# is missing (otherwise it keeps hunting to earn the adena).
PotionRestockFraction = 0.25
# Minutes of hunting worth of soulshots a bot likes to carry, and the fraction of that stock at which it restocks.
# Soulshots are bought only after the newbie soulshot reward has been claimed, as players do. A bot only makes a trip
# for soulshots when it can buy at least half its stock; otherwise it keeps hunting (without shots if it runs out) and
# tops them up whenever it is in town for something else.
SoulshotStockMinutes = 30
SoulshotRestockFraction = 0.2
# Smallest batch of soulshots a bot buys in town. It buys this many or more, or none on that visit, so a bot that
# is nearly full or nearly broke does not buy a handful. 0 = any amount. Never more than half the stock: with a small
# SoulshotStockMinutes the batch shrinks to half the stock so bots still buy shots.
SoulshotMinPurchase = 200
# Spiritshots a mage, summoner, healer or buffer fires per kill while cold, in place of SoulshotsPerKill (one shot per
# spell). They buy spiritshots of their grade, with the same stock and batch settings as soulshots.
SpiritshotsPerKill = 2
# Scrolls of Escape a bot likes to carry.
EscapeStock = 2
# Adena a bot never spends on supplies: the largest of ReserveFloor, level * ReservePerLevel and ReserveFraction of
# its adena. ReserveFraction is kept at 0.5 or below. Spellbooks at the trainer keep the same reserve, and a gatekeeper
# trip to another town's class master or trainer leaves at least ReserveFloor for the way back out.
ReserveFloor = 500
ReservePerLevel = 250
ReserveFraction = 0.10
# Walking speed of a cold bot, in game units per second (sets how long a walk takes).
MoveSpeed = 120
# How long a Scroll of Escape cast takes, in seconds.
EscapeCastSeconds = 20
# Time spent at each shop or NPC in town, in seconds.
ErrandStopSeconds = 15
# Chance, per town visit, of an AFK break, and how long one lasts (picked at random between the two), in minutes.
AfkChancePercent = 15
AfkMinMinutes = 2
AfkMaxMinutes = 10
# Healing potions a melee bot drinks per hour of cold hunting (hot bots drink real ones). Like the stock, tanks drink
# half again as many, casters, archers and healers half as many.
ColdPotionsPerHour = 4
# Bots per zone before it counts as full and others pick a different one (0 = no limit). A bot already hunting there
# only moves on once the zone is a quarter over this, so a zone at its limit does not empty out. This is a preference,
# not a wall: when every zone that fits a bot is full, it goes to the least crowded one, so a larger PopulationSize
# never needs this raised.
ZoneCapacity = 16
# How long a bot that has no way on waits in town before trying again, in seconds (at least 30). A bot too poor for
# any gatekeeper walks to the nearest zone that fits instead, so this only applies when no zone fits its level.
RetrySeconds = 300
# A town closer than this (game units, to its shops) is walked to even when the bot carries a Scroll of Escape.
WalkToTownWithin = 2500
# Cold kills pay like real ones: each zone lists its monsters, and a kill brings in the adena and loot of their real
# drop lists at this server's drop rates (Rates.ini), like L2Solo. The loot is sold to a shop at half its price on the
# bot's next town visit. False uses the flat AdenaPerMobLevel formula and no loot.
DropIncome = True
# Cold hunting has its dangers, like L2Solo: a bot can die (0 = never). This is the rate for a bot in the middle of a
# fitting zone with potions and gear for its level. It doubles at the bottom of the zone's levels and halves at the top,
# doubles again without potions, rises by half per gear tier it is behind, and is lower for tanks, higher for casters
# and archers. A death costs 6.5% minus 0.07% per level of the level's experience (no level is lost) and the bot
# recovers in the nearest town, then sells, restocks and heads out.
ColdDeathsPerHour = 0.3
DeathRecoverSeconds = 90
# Cold bots sit down to rest between fights: this long after this much hunting (casters and archers rest half again as
# long). Either 0 turns rests off.
RestEveryMinutes = 10
RestSeconds = 60
# A bot that dies twice in the same zone within this time stays away from it for this long, choosing zones two levels
# below its own meanwhile.
AvoidZoneMinutes = 60
# Bots change class the way players do: on reaching level 20, 40 and 76 they go to a class master of their race, take
# the class change quest, hunt for it this many minutes, then go back to a class master and change class. The master
# may be in another town, reached by gatekeeper. Each bot always takes the same branch. The third change uses the
# second class masters, since the server data has no third class master script. A quest length of 0 changes class on
# the first visit. False keeps every bot in its starting class.
ClassChanges = True
ClassQuestMinutes1 = 60
ClassQuestMinutes2 = 180
ClassQuestMinutes3 = 240
# Bots learn skills like players on this server (AutoLearnSkills is off): they earn SP while hunting (cold bots in
# proportion to their experience, at the zone monsters' real SP to experience ratio and the server's SP rate) and learn
# at their trainer, the class masters of their line, paying SP and buying the spellbooks the skill tree needs at the
# book's real price. Books no shop sells wait. They learn on town visits when the trainer is in that town, and make a
# trip of its own (by gatekeeper if needed) once three or more skill levels wait. Existing bots keep the skills they
# have. False gives every bot all the skills of its level for free, as before.
SkillTraining = True

# Bots gear up piece by piece like players: each keeps its own weapon, shield, armor pieces and jewelry. On a town visit
# it buys, slot by slot (weapon, chest, legs, helmet, gloves, boots, shield, jewelry), the best piece its class uses,
# its level allows (D from 20, C from 40, B from 52, A from 61, S from 76) and it can afford while keeping its adena
# reserve. A weapon counts by P.Atk (M.Atk for casters), armor by P.Def, a shield by its shield defense and jewelry by
# M.Def. Cold bots roll the weapon and armor drops of their zone's monsters and hot bots pick them up; either wears a
# drop that is better and fits its class, and sells the rest. A good upgrade it can afford is worth a trip to town.
# Existing bots get a full set of their current gear tier. False keeps the old whole-tier upgrades.
GearSlots = True
# Town shops only sell no-grade and D-grade gear. With this on, a bot can also buy any other piece as if from another
# player, at the item's reference price. This is a stand-in until bots trade with each other; with it off, better
# gear comes only from drops.
GearTrade = True

# The level at which cold progression stops.
MaxLevel = 80

# Hot/cold handoff (Phase 3). When a real player walks up to a cold bot it is materialized as a real, persistent
# character that hunts like a field phantom; when the player leaves it is cooled back and its progress is saved to
# the cold row. Its character (name, class, level, exp, skills) is remembered between handoffs and across restarts.
# Turn this off to keep the population purely abstract (Phase 1/2 behavior) while the module is enabled.
HandoffEnabled = True
# How often the proximity scan runs, in seconds. Lower is more responsive to a player walking by, at a small cost.
HandoffCheckSeconds = 5
# How close a real player must be (game units, horizontal) for a cold bot to go hot.
HandoffActivationRadius = 3000
# The wider radius a player must leave before a hot bot may cool. The gap from the activation radius is hysteresis
# that prevents spawn/despawn thrash when a player lingers near the edge. Keep it >= HandoffActivationRadius.
HandoffDeactivationRadius = 4000
# How long no real player may be within the deactivation radius before a hot bot cools back to cold, in seconds.
HandoffCooldownGraceSeconds = 30
# Ceiling on how many bots may be hot (live in the world) at once. 0 = the same as PopulationSize, so every bot near you
# can be live. They also count toward PhantomMaxCount in config/Custom/FakePlayers.ini.
HandoffMaxHotBots = 0

# How often the monitoring snapshot is written, in seconds. Lower shows the monitor fresher at a small cost.
SnapshotIntervalSeconds = 5

# Where the monitoring JSON snapshot is written, relative to the server working directory.
SnapshotFile = log/LivingPopulation.json
