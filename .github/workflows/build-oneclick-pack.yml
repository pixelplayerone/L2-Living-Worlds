name: Build one-click pack

# Builds the self-contained "install nothing" pack in the cloud so you never
# need JDK or Ant on your own machine. Click "Run workflow" in the Actions tab,
# wait for it to finish, then download the L2J-Offline-OneClick artifact.
on:
  # Manual only: run it from the Actions tab with "Run workflow" when you want a
  # fresh pack. It no longer builds automatically on push/merge.
  workflow_dispatch:
    inputs:
      mariadb_version:
        description: "Portable MariaDB version to bundle"
        required: false
        default: "11.4.5"
      version:
        description: "Release tag to stamp into the pack (e.g. v0.1.12) so the in-app updater knows its version"
        required: false
        default: ""

jobs:
  build-pack:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "L2J_Mobius_CT_0_Interlude github"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (full JDK - needed to bundle + to compile datapack scripts at runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Ensure Ant is available
        shell: pwsh
        run: |
          if (-not (Get-Command ant -ErrorAction SilentlyContinue)) {
            choco install ant --no-progress -y
          }
          ant -version

      - name: Set up .NET SDK 8 (to compile the one-click launcher exe)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the one-click pack
        shell: pwsh
        run: |
          $mdv = "${{ github.event.inputs.mariadb_version }}"
          if ([string]::IsNullOrWhiteSpace($mdv)) { $mdv = "11.4.5" }
          $ver = "${{ github.event.inputs.version }}"
          powershell -ExecutionPolicy Bypass -File "dist/launcher/build-pack.ps1" `
            -JdkHome "$env:JAVA_HOME" `
            -MariaDbVersion "$mdv" `
            -Version "$ver" `
            -OutDir "."

      - name: Upload the pack
        uses: actions/upload-artifact@v4
        with:
          name: L2J-Offline-OneClick
          path: "L2J_Mobius_CT_0_Interlude github/L2J-Offline-OneClick.zip"
          if-no-files-found: error
          retention-days: 30

      # The incremental patch zip (built from dist/launcher/patch-manifest.txt) for
      # existing testers to update without losing their database. Warn (don't fail)
      # if it is absent, so the full-pack build still succeeds when no manifest exists.
      - name: Upload the patch zip
        uses: actions/upload-artifact@v4
        with:
          name: L2J-Offline-Patch
          path: "L2J_Mobius_CT_0_Interlude github/L2J-Offline-Patch.zip"
          if-no-files-found: warn
          retention-days: 30

      # The standalone one-click launcher exe. It also ships inside the pack, but
      # is uploaded on its own so it can be attached to the release as an asset -
      # update.ps1 and the compiled launcher fetch it into existing installs.
      - name: Upload the launcher exe
        uses: actions/upload-artifact@v4
        with:
          name: LivingWorld-launcher
          path: "L2J_Mobius_CT_0_Interlude github/LivingWorld.exe"
          if-no-files-found: warn
          retention-days: 30
